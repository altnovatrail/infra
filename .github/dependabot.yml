version: 2

updates:
  # The actions of the workflows, and the references to .github's shared workflows with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # Every reference to a shared workflow of .github in one pull request, to one release:
      # Dependabot names each altnovatrail/.github/.github/workflows/<file>.yml.
      shared-workflows:
        patterns: ["altnovatrail/.github/*"]

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # The providers of the root module in tofu/ (R10). The two are released together and Firebase
  # needs both, so they move as one pull request. Dependabot locks the new version for the
  # platforms whose hashes the lock file already holds, which are all the release ships. OpenTofu
  # itself, an ARG of .devcontainer/Dockerfile and required_version in tofu/versions.tf, it does
  # not see, and that is raised by hand (R09).
  - package-ecosystem: opentofu
    directory: /tofu
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      google-providers:
        patterns: ["hashicorp/google", "hashicorp/google-beta"]

  # The packages of tools/, the checks of the deployment's list (R14): ajv and what it needs. A
  # pull request that raises them runs the licenses check and the checks' tests in the job Deploy.
  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
