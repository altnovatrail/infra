# The toolchain stage of .devcontainer/Dockerfile as the image novatrail-toolchain, for the jobs of
# ci.yml that run their recipes in it by spec/tools/toolchain/toolchain.sh (R30 spec; R32). The
# image comes from the cache of GitHub Actions, as a file of docker save, by the key and the path
# the shared Documents check of .github and spec's CI give it, so the three share one entry: on a
# hit the Dockerfile does not run, and a failure of nodejs.org, GitHub or the Ubuntu snapshot fails
# no check (the second 2026-11-09 amendment to R31 spec; R36 .github; sources 5.8). Needs the
# repository checked out with its spec submodule.
name: Toolchain image
description: Loads the toolchain stage from the cache, or builds it and fills the cache.

runs:
  using: composite
  steps:
    - id: cache
      name: Toolchain image from the cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/novatrail-toolchain.tar
        key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

    # spec's script loads the file and removes it, or builds the stage and writes the file.
    - id: image
      name: Toolchain image
      shell: bash
      env:
        TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain.tar
      run: spec/tools/toolchain/toolchain.sh build

    # Only on a miss: an entry never changes. A file that docker save could not write, or an entry
    # another job of the run saved first, only warns (sources 5.8).
    - name: Toolchain image to the cache
      if: steps.image.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/novatrail-toolchain.tar
        key: ${{ steps.cache.outputs.cache-primary-key }}

    # The image, if the build gave one, is in docker now, and the recipes need the disk.
    - name: Free the file of the toolchain image
      if: ${{ !cancelled() }}
      shell: bash
      run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain.tar"
