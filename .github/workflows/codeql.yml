# CodeQL over the repository's workflows and its languages (R09 .github), pinned to a release of
# .github. The job gives the shared workflow what it needs to upload its results. Besides the
# workflows, the code is JavaScript: the checks and the deployment under tools/ and the tests of
# tofu/ (T28; Д9 of spec's RUN.md). CodeQL analyses neither HCL nor bash: its list of supported
# languages names neither (CodeQL, Supported languages and frameworks, read 2026-11-09).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: altnovatrail/.github/.github/workflows/codeql.yml@706f4067a66c91b0442033f82a7924eeb8b60497 # v0.1.21
    with:
      languages: javascript-typescript
