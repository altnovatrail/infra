# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@93c848fb51a10a245968cf730b99cc709a7748bf # v0.1.31

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@93c848fb51a10a245968cf730b99cc709a7748bf # v0.1.31

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@93c848fb51a10a245968cf730b99cc709a7748bf # v0.1.31

  # The images of the two stages of .devcontainer/Dockerfile infra's jobs run in, each built at most
  # once a run (R32; R42 .github, R47 .github): toolchain-core — Node, just, Go and buf — for Deploy,
  # and toolchain, the core with OpenTofu, ShellCheck and actionlint (R09), for OpenTofu. On a hit
  # of the cache this job only looks the entries up, and each job after it restores its file; on a
  # miss it builds the image alone, the core first, whose layers the build of toolchain then reuses,
  # hands its file to them as an artifact of the run, and on a push to main saves it into the cache.
  # The shared Documents check runs in the core too and keeps the same entry, but builds its own on
  # a miss: a called workflow does not see the jobs of this file.
  toolchain:
    name: Toolchain image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      core: ${{ steps.core.outputs.artifact }}
      artifact: ${{ steps.toolchain.outputs.artifact }}
    steps:
      # The Dockerfile, which the key hashes and the build reads, and the action: a sparse checkout
      # fetches no other file and not the spec submodule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .devcontainer/Dockerfile
            .github/actions/toolchain/action.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: core
        uses: ./.github/actions/toolchain
        with:
          role: build
          stage: toolchain-core

      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          role: build
          stage: toolchain

  # infra's own check: the OpenTofu and the ShellCheck of the toolchain stage of
  # .devcontainer/Dockerfile, at the versions its ARGs name, and the tests of the recipes that check
  # them (R09), and actionlint over the workflows (R18); then the root module in tofu/ — its format, an init by the lock file, a validate and
  # its tests on mock providers (R10) — and bootstrap.sh, by ShellCheck and against a stand-in
  # gcloud (R13). spec's script runs the recipes in the stage, as the shared Documents check runs its
  # own (R30 spec), and the stage comes from the cache, or from the job Toolchain image (R32). It
  # runs whatever that job's verdict, unless the run is cancelled: a required check skipped because
  # the job it needs failed would count as passed.
  opentofu:
    name: OpenTofu
    needs: toolchain
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # With the spec submodule: toolchain.sh is spec's, at the tag this repository pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/toolchain
        with:
          role: load
          stage: toolchain
          artifact: ${{ needs.toolchain.outputs.artifact }}

      - name: OpenTofu
        run: |
          spec/tools/toolchain/toolchain.sh run just ci-tofu-test
          spec/tools/toolchain/toolchain.sh run just ci-tofu
          spec/tools/toolchain/toolchain.sh run just tf-check
          spec/tools/toolchain/toolchain.sh run just ci-shellcheck-test
          spec/tools/toolchain/toolchain.sh run just ci-shellcheck
          spec/tools/toolchain/toolchain.sh run just bootstrap-test
          spec/tools/toolchain/toolchain.sh run just ci-actionlint-test
          spec/tools/toolchain/toolchain.sh run just ci-actionlint

  # The checks of the deployment's list (R05, R14) and api's deployment (R15), in the stage
  # toolchain-core, which holds the Node, just and bash they run, with the jq of the base image, and
  # none of the three tools of OpenTofu's stage, which they do not call: the licenses of tools/, the checks' tests on synthetic releases, the check of a
  # release's files on a real release of api, against GitHub and Sigstore, the test of api's
  # deployment on stand-ins, the organizer's tool's on a stand-in for gcloud (R28), and the list
  # itself when the pull request changes what it is checked or deployed by: deploy/, the checks and
  # the deployment, their packages, the justfile or the tag of spec. The whole history, so that the
  # list on main is there to compare with. The stage comes as in OpenTofu, from the entry the shared
  # Documents check keeps too (R32).
  # The check of a real release waits on the network, so it runs beside the tests on stand-ins, in a
  # container of its own, once deploy-check-test has installed the packages of tools/ it reads too.
  # Its output comes after theirs, even when one of them fails, and the step fails when any does.
  # ci-deploy-check comes after it: both run spec's release-verify, whose first call installs spec's
  # tools/ (row 7.25 of COORDINATION.md spec).
  deploy:
    name: Deploy
    needs: toolchain
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/toolchain
        with:
          role: load
          stage: toolchain-core
          artifact: ${{ needs.toolchain.outputs.core }}

      - name: Deploy
        run: |
          spec/tools/toolchain/toolchain.sh run just ci-licenses
          spec/tools/toolchain/toolchain.sh run just deploy-check-test
          release_log="$RUNNER_TEMP/deploy-check-release-test.log"
          spec/tools/toolchain/toolchain.sh run just deploy-check-release-test > "$release_log" 2>&1 &
          release=$!
          status=0
          {
            spec/tools/toolchain/toolchain.sh run just deploy-api-test &&
              spec/tools/toolchain/toolchain.sh run just deploy-app-test &&
              spec/tools/toolchain/toolchain.sh run just deploy-target-test &&
              spec/tools/toolchain/toolchain.sh run just tools-install-test &&
              spec/tools/toolchain/toolchain.sh run just organizer-test
          } || status=$?
          wait "$release" || status=$?
          cat "$release_log"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          spec/tools/toolchain/toolchain.sh run just ci-deploy-check origin/main

  # The deployment's tools as its jobs install them, on the runner they run on (R18): each download
  # against the sum written down, and the runner's Docker engine against the version named. A sum or
  # an engine that no longer holds shows here, in a pull request, not first in a deployment.
  tools:
    name: Deployment tools
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # In a pull request only when it changes what the tools are installed by; on main always, so
      # that a runner whose Docker engine moved on shows after the next merge, before a deployment.
      - name: Whether the tools change
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          install=true
          if [ "$EVENT" = pull_request ]; then
            changed="$(git diff --name-only "origin/${BASE}...HEAD" -- tools/ci .github/actions/tools .devcontainer/Dockerfile)"
            if [ -z "$changed" ]; then install=false; fi
          fi
          echo "install=${install}" >> "$GITHUB_OUTPUT"
          if [ "$install" = false ]; then echo "::notice::Nothing the deployment's tools are installed by changes: they are not installed."; fi

      - uses: ./.github/actions/tools
        if: steps.changed.outputs.install == 'true'
        with:
          tools: tofu just node gcloud jq buildx docker

      - name: Versions
        if: steps.changed.outputs.install == 'true'
        run: |
          tofu version
          just --version
          node --version
          gcloud --version
          jq --version
          docker buildx version
