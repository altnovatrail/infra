# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@706f4067a66c91b0442033f82a7924eeb8b60497 # v0.1.21

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@706f4067a66c91b0442033f82a7924eeb8b60497 # v0.1.21

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@706f4067a66c91b0442033f82a7924eeb8b60497 # v0.1.21

  # infra's own check: the OpenTofu and the ShellCheck of the toolchain stage of
  # .devcontainer/Dockerfile, at the versions its ARGs name, and the tests of the recipes that check
  # them (R09); then the root module in tofu/ — its format, an init by the lock file, a validate and
  # its tests on mock providers (R10) — and bootstrap.sh, by ShellCheck and against a stand-in
  # gcloud (R13). spec's script builds the stage and runs the recipes in it, as the shared Documents
  # check runs its own (R30 spec).
  opentofu:
    name: OpenTofu
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # With the spec submodule: toolchain.sh is spec's, at the tag this repository pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: OpenTofu
        run: |
          spec/tools/toolchain/toolchain.sh build
          spec/tools/toolchain/toolchain.sh run just ci-tofu-test
          spec/tools/toolchain/toolchain.sh run just ci-tofu
          spec/tools/toolchain/toolchain.sh run just tf-check
          spec/tools/toolchain/toolchain.sh run just ci-shellcheck-test
          spec/tools/toolchain/toolchain.sh run just ci-shellcheck
          spec/tools/toolchain/toolchain.sh run just bootstrap-test

  # The checks of the deployment's list (R05, R14) and api's deployment (R15), in the same
  # toolchain stage: the licenses of tools/, the checks' tests on synthetic releases, the check of a
  # release's files on a real release of api, against GitHub and Sigstore, the test of api's
  # deployment on stand-ins, and the list itself when the pull request changes what it is checked or
  # deployed by: deploy/, the checks and the deployment, their packages, the justfile or the tag of
  # spec. The whole history, so that the list on main is there to compare with.
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Deploy
        run: |
          spec/tools/toolchain/toolchain.sh build
          spec/tools/toolchain/toolchain.sh run just ci-licenses
          spec/tools/toolchain/toolchain.sh run just deploy-check-test
          spec/tools/toolchain/toolchain.sh run just deploy-check-release-test
          spec/tools/toolchain/toolchain.sh run just deploy-api-test
          spec/tools/toolchain/toolchain.sh run just ci-deploy-check origin/main
