# NovaTrail's shared checks, pinned to a release of .github by SHA with its version beside it;
# Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34

  # Each stage infra's jobs run in is built at most once a run, here, and handed to them as an
  # artifact of the run. The shared Documents check keeps the core's entry too, but builds its own
  # on a miss: a called workflow does not see the jobs of this file.
  toolchain:
    name: Toolchain image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      core: ${{ steps.core.outputs.artifact }}
      toolchain: ${{ steps.toolchain.outputs.artifact }}
    steps:
      # The Dockerfile, which the key hashes and the build reads, and the action: a sparse checkout
      # fetches no other file and not the spec submodule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .devcontainer/Dockerfile
            .github/actions/toolchain/action.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: core
        uses: ./.github/actions/toolchain
        with:
          role: build
          stage: toolchain-core

      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          role: build
          stage: toolchain

  # Required in the ruleset of main. It runs whatever the verdict of Toolchain image, unless the run
  # is cancelled: a required check skipped because the job it needs failed would count as passed.
  opentofu:
    name: OpenTofu
    needs: toolchain
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # With the spec submodule: toolchain.sh is spec's, at the tag this repository pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/toolchain
        with:
          role: load
          stage: toolchain
          artifact: ${{ needs.toolchain.outputs.toolchain }}

      - name: OpenTofu
        run: |
          spec/tools/toolchain/toolchain.sh run just ci-tofu-test
          spec/tools/toolchain/toolchain.sh run just ci-tofu
          spec/tools/toolchain/toolchain.sh run just tf-check
          spec/tools/toolchain/toolchain.sh run just ci-shellcheck-test
          spec/tools/toolchain/toolchain.sh run just ci-shellcheck
          spec/tools/toolchain/toolchain.sh run just bootstrap-test
          spec/tools/toolchain/toolchain.sh run just ci-actionlint-test
          spec/tools/toolchain/toolchain.sh run just ci-actionlint

  # The checks of the deployment's list and the tests of the deployment, in the core: they call none
  # of the three tools of OpenTofu's stage. The whole history, so that the list on main is there to
  # compare with.
  # The check of a real release waits on the network, so it runs beside the tests on stand-ins, in a
  # container of its own, once deploy-check-test has installed the packages of tools/ it reads too.
  # Its output comes after theirs, even when one of them fails, and the step fails when any does.
  # ci-deploy-check comes after it: both run spec's release-verify, whose first call installs spec's
  # tools/.
  deploy:
    name: Deploy
    needs: toolchain
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/toolchain
        with:
          role: load
          stage: toolchain-core
          artifact: ${{ needs.toolchain.outputs.core }}

      - name: Deploy
        run: |
          spec/tools/toolchain/toolchain.sh run just ci-licenses
          spec/tools/toolchain/toolchain.sh run just deploy-check-test
          release_log="$RUNNER_TEMP/deploy-check-release-test.log"
          spec/tools/toolchain/toolchain.sh run just deploy-check-release-test > "$release_log" 2>&1 &
          release=$!
          status=0
          {
            spec/tools/toolchain/toolchain.sh run just deploy-api-test &&
              spec/tools/toolchain/toolchain.sh run just deploy-app-test &&
              spec/tools/toolchain/toolchain.sh run just deploy-target-test &&
              spec/tools/toolchain/toolchain.sh run just tools-install-test &&
              spec/tools/toolchain/toolchain.sh run just organizer-test
          } || status=$?
          wait "$release" || status=$?
          cat "$release_log"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          spec/tools/toolchain/toolchain.sh run just ci-deploy-check origin/main

  # The deployment's tools as its jobs install them, on the runner they run on: each download
  # against the sum written down, and the runner's Docker engine against the version named. A sum or
  # an engine that no longer holds shows here, in a pull request, not first in a deployment.
  tools:
    name: Deployment tools
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # In a pull request only when it changes what the tools are installed by; on main always, so
      # that a runner whose Docker engine moved on shows after the next merge, before a deployment.
      - name: Whether the tools change
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          install=true
          if [ "$EVENT" = pull_request ]; then
            changed="$(git diff --name-only "origin/${BASE}...HEAD" -- tools/ci .github/actions/tools .devcontainer/Dockerfile)"
            if [ -z "$changed" ]; then install=false; fi
          fi
          echo "install=${install}" >> "$GITHUB_OUTPUT"
          if [ "$install" = false ]; then echo "::notice::Nothing the deployment's tools are installed by changes: they are not installed."; fi

      - uses: ./.github/actions/tools
        if: steps.changed.outputs.install == 'true'
        with:
          tools: tofu just node gcloud jq buildx docker

      - name: Versions
        if: steps.changed.outputs.install == 'true'
        run: |
          tofu version
          just --version
          node --version
          gcloud --version
          jq --version
          docker buildx version
